name: aidlc-artifact-hygiene
event: post-write
tiers: [1, 2, 3]
design_ref: "Conversion Technical Guide > Guardrail layer: hooks"
description: "Keeps durable artifacts clean: no secrets, no raw prompt wrappers, no unresolved markers once approved, no hand-written evidence"
codes:
  H01: secret pattern
  H02: raw context wrapper
  H03: unresolved TBD/TODO in an approved artifact
  H04: artifact outside the writer persona's manifest (phase 3, with personas)
  H05: evidence artifact not generated by aidlc-evidence-verifier
