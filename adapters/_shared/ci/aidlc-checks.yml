# AIDLC artifact checks — copy to .github/workflows/aidlc-checks.yml (setup/install-ci.sh does this).
# Runs on every pull request, so agents without hook support are still held to the rails at merge.
# Set AGENT_DIR to your agent directory (.claude, .cursor, .github or .sdlc).
name: aidlc-checks
on:
  pull_request:
  schedule:
    - cron: "0 7 * * 1-5"   # weekday mornings: gate SLAs and stale knowledge
env:
  AGENT_DIR: .claude
jobs:
  rails:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hook integrity (hooks match the installed manifest and are still wired)
        run: bash $AGENT_DIR/hooks/_bin/aidlc-integrity.sh
      - name: Phase quality gate (traceability, consistency, hygiene)
        run: bash $AGENT_DIR/hooks/aidlc-phase-quality-gate/aidlc-phase-quality-gate.sh
      - name: Consistency across all phases
        run: bash $AGENT_DIR/hooks/aidlc-artifact-consistency-check/aidlc-artifact-consistency-check.sh --all
      - name: Traceability across all phases
        run: bash $AGENT_DIR/hooks/aidlc-traceability-check/aidlc-traceability-check.sh --all
      - name: Wiki lint
        run: bash $AGENT_DIR/hooks/_bin/aidlc-wiki-lint.sh
      - name: Metrics and knowledge index (artifacts for the console)
        run: |
          bash $AGENT_DIR/hooks/_bin/aidlc-metrics.sh
          bash $AGENT_DIR/hooks/_bin/aidlc-knowledge-index.sh
          bash $AGENT_DIR/hooks/_bin/aidlc-portfolio.sh
      - uses: actions/upload-artifact@v4
        with:
          name: aidlc-console-data
          path: docs/aidlc/console-data/
  scheduled:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gate SLA
        run: bash $AGENT_DIR/hooks/_bin/aidlc-sla.sh || echo "::warning::$(bash $AGENT_DIR/hooks/_bin/aidlc-sla.sh)"
      - name: Stale knowledge
        run: bash $AGENT_DIR/hooks/_bin/aidlc-wiki-lint.sh --stale-only || true
