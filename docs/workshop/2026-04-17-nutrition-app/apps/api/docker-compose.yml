services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nutrikids
      POSTGRES_PASSWORD: nutrikids
      POSTGRES_DB: nutrikids
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutrikids"]
      interval: 2s
      timeout: 2s
      retries: 20
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nutrikids
      POSTGRES_PASSWORD: nutrikids
      POSTGRES_DB: nutrikids_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutrikids"]
      interval: 2s
      timeout: 2s
      retries: 20
