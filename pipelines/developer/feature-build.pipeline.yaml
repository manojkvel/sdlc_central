pipeline:
  name: "Feature Build"
  description: "Build a feature from plan — plan check, task breakdown, wave scheduling, implementation, spec compliance, fix findings"
  role: developer
  trigger: "When a plan is approved and ready for implementation"

steps:
  - id: check-plan
    skill: plan-check
    args: "$INPUT"
    description: "Audit the plan before any code is written (writes PLAN_CHECK.md; the pre-write guard enforces it on tier 2-3)"
    gate:
      type: decision
      pass_condition: "marker == PLAN CHECK PASSED"
      on_fail: stop

  - id: break-tasks
    skill: task-gen
    args: "$INPUT"
    depends_on: [check-plan]
    description: "Break implementation plan into atomic, implementable tasks"

  - id: schedule
    skill: wave-scheduler
    args: "$break-tasks.output"
    depends_on: [break-tasks]
    description: "Compute execution waves respecting dependency ordering"

  - id: implement
    skill: task-implementer
    args: "$break-tasks.output"
    depends_on: [schedule]
    description: "Implement tasks with TDD and traceability"

  - id: verify-evidence
    skill: aidlc-evidence-verifier
    args: "verify"
    depends_on: [implement]
    description: "Map every AC and SC to fresh recorded evidence, re-run the suite once, write the sealed VERIFICATION.md"
    gate:
      type: decision
      pass_condition: "marker == VERIFICATION COMPLETE"
      on_fail:
        auto_recover: review-fix
        fallback: hitl

  - id: verify-spec
    skill: spec-review
    args: "$INPUT"
    depends_on: [verify-evidence]
    description: "Validate implementation matches the original spec"
    gate:
      type: quality
      on_fail:
        auto_recover: review-fix
        fallback: hitl

  - id: fix-findings
    skill: review-fix
    args: "$verify-spec.output"
    depends_on: [verify-spec]
    description: "Auto-fix any CRITICAL or HIGH findings from spec review"

output:
  summary: "Feature implemented with spec compliance verified"
  artifacts: [tasks.md, implementation-report.md, VERIFICATION.md, evidence/index.json, spec-review.md]
  next_pipeline: "developer/pr-workflow"
