# Go core of Atticus (roadmap M1): vet and test on Linux, macOS and Windows.
name: atticus-core
on:
  pull_request:
    paths: ["go.mod", "go.sum", "cmd/**", "internal/**", ".github/workflows/core.yml"]
  push:
    branches: [main, aidlc_framework]
    paths: ["go.mod", "go.sum", "cmd/**", "internal/**", ".github/workflows/core.yml"]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Build
        run: go build -o build/ ./cmd/atticus
